# NOTE: Hanko loads config with koanf + kelseyhightower/envconfig. It does NOT
# expand `{{ .Env.X }}` templates. Values below are localhost defaults; any field
# whose env var is set (envconfig runs after the YAML load) is overridden at
# startup. envconfig maps env vars onto these fields (set in the compose files):
#   database.user                  -> DATABASE_USER                  (from POSTGRES_USER)
#   database.password              -> DATABASE_PASSWORD              (from POSTGRES_PASSWORD)
#   database.database              -> DATABASE_DATABASE              (from POSTGRES_DB)
#   secrets.keys                   -> SECRETS_KEYS                   (from HANKO_SECRETS_KEYS)
#   webauthn.relying_party.id      -> WEBAUTHN_RELYING_PARTY_ID      (from APP_HOST; bare host, no scheme/port)
#   webauthn.relying_party.origins -> WEBAUTHN_RELYING_PARTY_ORIGINS (from APP_BASE_URL; comma-separated for multiple)
#
# CORS is ALSO set via env in the compose files, which is the authoritative
# channel (envconfig applies env vars after this file loads, and works even if
# this file fails to mount and Hanko falls back to its defaults):
#   server.public.cors.allow_origins                 -> SERVER_PUBLIC_CORS_ALLOW_ORIGINS                 (static "*")
#   server.public.cors.unsafe_wildcard_origin_allowed -> SERVER_PUBLIC_CORS_UNSAFE_WILDCARD_ORIGIN_ALLOWED (static "true")
# The wildcard below is a fallback with the same effect. Both the origin list and
# the unsafe flag must agree — a "*" origin without the flag fails startup
# validation. To lock CORS down for a real deployment, set both the env vars and
# the block below to your exact web origin(s), e.g.:
#   allow_origins:
#     - "https://app.example.com"
#   unsafe_wildcard_origin_allowed: false
database:
  # user, password, and database name are injected via the DATABASE_* env vars
  host: auth-db
  port: 5432
  dialect: postgres

email_delivery:
  enabled: true
  email:
    from_address: no-reply@example.com
    from_name: MEST BDT Application
  smtp:
    host: mailslurper
    port: 2500

# secrets.keys is injected via the SECRETS_KEYS env var (from HANKO_SECRETS_KEYS
# in deployment/.env). It MUST be set to a strong value — if it is missing, Hanko
# falls back to a well-known default signing key and issued sessions are insecure.
# (`SECRET_KEYS` / top-level `secret_keys` only exist on unreleased Hanko; the
# released image reads `secrets.keys`.)

service:
  name: MEST BDT Auth

webauthn:
  relying_party:
    # Overridden by WEBAUTHN_RELYING_PARTY_ID (from APP_HOST) for non-localhost hosts.
    id: "localhost"
    display_name: "MEST BDT Auth"
    # Overridden by WEBAUTHN_RELYING_PARTY_ORIGINS (from APP_BASE_URL) for non-localhost hosts.
    origins:
      - "http://localhost:3000"

server:
  public:
    cors:
      # Explicitly allow the local web application origin to ensure browsers
      # do not block credentialed CORS requests.
      allow_origins:
        - "http://localhost:3000"
      unsafe_wildcard_origin_allowed: false
