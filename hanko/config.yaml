# NOTE: Hanko loads config with koanf + kelseyhightower/envconfig. It does NOT
# expand `{{ .Env.X }}` templates. Connection details are injected via env vars
# that envconfig maps onto these fields (set in the compose files):
#   database.user     -> DATABASE_USER      (from POSTGRES_USER)
#   database.password -> DATABASE_PASSWORD  (from POSTGRES_PASSWORD)
#   database.database -> DATABASE_DATABASE  (from POSTGRES_DB)
#   secret_keys       -> SECRET_KEYS        (from HANKO_SECRETS_KEYS)
database:
  # user, password, and database name are injected via the DATABASE_* env vars
  host: auth-db
  port: 5432
  dialect: postgres

email_delivery:
  enabled: true
  email:
    from_address: no-reply@example.com
    from_name: MEST BDT Application
  smtp:
    host: mailslurper
    port: 2500

# secret_keys injected via the SECRET_KEYS env var (see deployment/*.yml).
# Top-level `secret_keys` replaces the deprecated `secrets.keys` list.

service:
  name: MEST BDT Auth

webauthn:
  relying_party:
    id: "localhost"
    display_name: "MEST BDT Auth"
    origins:
      - "http://localhost:3000"

server:
  public:
    cors:
      allow_origins:
        - "http://localhost:3000"
      unsafe_wildcard_origin_allowed: true
