services:
  api-db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - api_db_data:/data/db

  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hanko
      POSTGRES_PASSWORD: ${HANKO_DATABASE_PASSWORD:-hankopassword}
      POSTGRES_DB: hanko
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanko -d hanko"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    image: ghcr.io/teamhanko/hanko:latest
    command: serve all
    ports:
      - "8000:8000"
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ../hanko/config.yaml:/config/config.yaml
    depends_on:
      auth-db:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully

  auth-migrate:
    image: ghcr.io/teamhanko/hanko:latest
    command: migrate up
    env_file:
      - .env
    volumes:
      - ../hanko/config.yaml:/config/config.yaml
    depends_on:
      auth-db:
        condition: service_healthy

  openinary:
    image: openinary/openinary:latest
    ports:
      - "3002:3000"
    volumes:
      - ../openinary/cache:/app/apps/api/cache
      - ../openinary/public:/app/apps/api/public
      - ../openinary/data:/app/data
    environment:
      - MODE=fullstack
      - BETTER_AUTH_SECRET=${OPENINARY_AUTH_SECRET:-very-secret-openinary-key}
      - BETTER_AUTH_URL=http://localhost:3002

  mailslurper:
    image: marcopas/docker-mailslurper
    ports:
      - "2500:2500"
      - "8080:8080"
      - "8085:8085"

volumes:
  api_db_data:
  auth_db_data:
