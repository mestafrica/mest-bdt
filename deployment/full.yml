services:
  api-db:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - api_db_data:/data/db

  auth-db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanko -d hanko"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    image: ghcr.io/teamhanko/hanko:latest
    restart: unless-stopped
    command: serve all
    ports:
      - "8000:8000"
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ../hanko/config.yaml:/config/config.yaml
    depends_on:
      auth-db:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully

  auth-migrate:
    image: ghcr.io/teamhanko/hanko:latest
    command: migrate up
    env_file:
      - .env
    volumes:
      - ../hanko/config.yaml:/config/config.yaml
    depends_on:
      auth-db:
        condition: service_healthy

  openinary:
    image: openinary/openinary:latest
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - openinary_cache:/app/apps/api/cache
      - openinary_public:/app/apps/api/public
      - openinary_data:/app/data
    env_file:
      - .env

  api:
    build:
      context: ../api
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    depends_on:
      api-db:
        condition: service_started
      auth:
        condition: service_started
      openinary:
        condition: service_started

  web:
    build:
      context: ../web
      args:
        - NEXT_PUBLIC_HANKO_API_URL=http://localhost:8000
        - NEXT_PUBLIC_BDT_API_URL=http://localhost:3001
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started

  mailslurper:
    image: marcopas/docker-mailslurper
    restart: unless-stopped
    ports:
      - "2500:2500"
      - "8080:8080"
      - "8085:8085"

volumes:
  api_db_data:
  auth_db_data:
  openinary_cache:
  openinary_public:
  openinary_data:
